# LiveKit em produção (as chaves vêm de LIVEKIT_KEYS, definida no docker-compose a partir do .env).
port: 7880
bind_addresses:
  - "0.0.0.0"
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Descobre o IP público da VPS (necessário atrás de NAT do provedor).
  use_external_ip: true

# TURN embutido, para quem está em rede que bloqueia UDP (redes corporativas, hotéis).
turn:
  enabled: true
  domain: turn.space.ai-infinity.io
  tls_port: 5349
  udp_port: 3478
  # Certificado emitido pelo Caddy (volume caddy_data). Renova a cada ~60 dias:
  # reinicie o LiveKit depois da renovação (docs/infra.md).
  cert_file: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.space.ai-infinity.io/turn.space.ai-infinity.io.crt
  key_file: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.space.ai-infinity.io/turn.space.ai-infinity.io.key

room:
  # Uma sala só para o escritório inteiro; a privacidade de quem ouve quem é aplicada pelo servidor do mundo.
  empty_timeout: 300
  max_participants: 60
