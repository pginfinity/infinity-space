name: Deploy

# Publica na VPS quando a verificação passa na main.
# Secrets necessários (Settings → Secrets → Actions): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
# Na VPS: repositório clonado em /opt/infinity-space, com o .env de produção (modelo em .env.example).

on:
  workflow_run:
    workflows: [Verificação]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Atualizar e subir na VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new "$USER@$HOST" '
            set -e
            cd /opt/infinity-space
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
            docker image prune -f
          '
